services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: lexvault_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lexvault_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  django:
    build: .
    container_name: lexvault_django
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development

    ports:
      - "8000:8000"

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/app
      - media_data:/app/media
      - uv_cache:/root/.cache/uv
      - hf_cache:/root/.cache/huggingface


  celery_worker:
    build: .
    container_name: lexvault_celery_worker
    restart: unless-stopped
    command: celery -A config worker --loglevel=info

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development

    depends_on:
      - postgres
      - redis

    volumes:
      - .:/app
      - media_data:/app/media
      - uv_cache:/root/.cache/uv
      - hf_cache:/root/.cache/huggingface


  flower:
    build: .
    container_name: lexvault_flower
    restart: unless-stopped
    command: celery -A config flower --port=5555

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development

    ports:
      - "5555:5555"

    depends_on:
      - redis
      - celery_worker

    volumes:
      - .:/app
      - uv_cache:/root/.cache/uv
      - hf_cache:/root/.cache/huggingface


volumes:
  postgres_data:
  uv_cache:
  hf_cache:
  media_data: