[project]
name = "lexvault-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.42",
    "celery>=5.6.3",
    "django>=6.0.7",
    "django-environ>=0.14.0",
    "django-storages>=1.14.6",
    "djangorestframework>=3.17.1",
    "pgvector>=0.5.0",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pymupdf>=1.28.0",
    "python-magic>=0.4.27",
    "redis>=8.0.1",
    "sentence-transformers>=5.6.0",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "coverage>=7.15.0",
    "django-debug-toolbar>=7.0.0",
    "django-extensions>=4.1",
    "django-seed>=0.3.1",
    "factory-boy>=3.3.3",
    "faker>=40.28.1",
    "flower>=2.0.1",
    "ipython>=9.15.0",
    "isort>=8.0.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.20",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
